name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Model tests
        run: node tests/model.test.js
      - name: Browser check (the app end to end, and the PDF it makes)
        run: |
          pip install --quiet playwright pypdf pillow
          python -m playwright install --with-deps chromium
          python tests/ui_check.py

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble the site
        run: |
          mkdir -p site
          cp index.html app.css sw.js manifest.webmanifest .nojekyll site/
          cp -r js vendor fonts icons site/
      - name: Check the service worker's files and stamp its version
        run: python3 tools/stamp_sw.py site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
