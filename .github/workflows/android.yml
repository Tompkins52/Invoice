name: Android app

# Builds the Google Play bundle (AAB) from the web app, signed with the upload key when the four
# BILLHEAD_* secrets are set, and runs the debug build on an emulator: start, state file, backup round trip.
# versionCode is 100 plus the run number (1 to 99 are hand builds), so every run is a new, higher version for Play.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.css"
      - "js/**"
      - "vendor/**"
      - "fonts/**"
      - "icons/**"
      - "native/**"
      - "tools/assemble_native.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version shown to users, for example 1.0.1"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ github.event.inputs.versionName || '1.0.0' }}
      KS_B64: ${{ secrets.BILLHEAD_KEYSTORE_BASE64 }}
      BILLHEAD_KEYSTORE_PASSWORD: ${{ secrets.BILLHEAD_KEYSTORE_PASSWORD }}
      BILLHEAD_KEY_ALIAS: ${{ secrets.BILLHEAD_KEY_ALIAS }}
      BILLHEAD_KEY_PASSWORD: ${{ secrets.BILLHEAD_KEY_PASSWORD }}
    outputs:
      versionCode: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Model tests
        run: node tests/model.test.js

      - name: Install the shell's packages
        working-directory: native
        run: npm ci --no-audit --no-fund

      - name: Assemble the web app into the shell
        run: python3 tools/assemble_native.py

      - name: Native path check (the shell stubbed, in Chromium)
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python tests/native_check.py

      - name: Copy into the Android project
        working-directory: native
        run: npx cap sync android

      - name: Build the release bundle and the debug test app
        working-directory: native/android
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export BILLHEAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          fi
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --no-daemon -PversionCode=$((100 + ${{ github.run_number }})) -PversionName="$VERSION_NAME"
          ls -la app/build/outputs/bundle/release/ app/build/outputs/apk/debug/
          if [ -n "$KS_B64" ]; then
            jarsigner -verify app/build/outputs/bundle/release/app-release.aab && echo "Signed with the upload key: ready for Play Console."
          else
            echo "::warning::No BILLHEAD_* secrets, so the bundle is unsigned. Play Console rejects unsigned bundles; add the secrets (see native/README.md)."
          fi

      - name: Keep the bundle
        uses: actions/upload-artifact@v4
        with:
          name: billhead-${{ env.VERSION_NAME }}-${{ github.run_number }}-aab
          path: native/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Keep the debug app for the emulator
        uses: actions/upload-artifact@v4
        with:
          name: billhead-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: billhead-debug-apk
          path: apk
      - name: Pillow for the screenshot check
        run: pip install --quiet pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash native/smoke/smoke.sh apk/app-debug.apk
      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-run-${{ github.run_number }}
          path: native/smoke/out
          if-no-files-found: ignore
